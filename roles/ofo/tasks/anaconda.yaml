---

- name: GET_URL ; download miniconda installer
  become: true
  get_url:
    url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
    dest: /tmp/Miniconda3-latest-Linux-x86_64.sh
    mode: 775

- name: SHELL ; run miniconda installer
  shell:
    cmd: /tmp/Miniconda3-latest-Linux-x86_64.sh -b
  args:
    creates: ~/miniconda3

- name: SHELL ; run conda init
  shell:
    cmd: ~/miniconda3/bin/conda init
  args:
    executable: /bin/bash

# IMPORTANT: Configure conda-forge BEFORE any conda operations
- name: Configure conda to use conda-forge exclusively
  shell:
    cmd: |
      # Remove ALL default channels first
      ~/miniconda3/bin/conda config --remove channels defaults || true
      ~/miniconda3/bin/conda config --remove channels https://repo.anaconda.com/pkgs/main || true  
      ~/miniconda3/bin/conda config --remove channels https://repo.anaconda.com/pkgs/r || true
      ~/miniconda3/bin/conda config --remove channels pkgs/main || true
      ~/miniconda3/bin/conda config --remove channels pkgs/r || true
      # Add conda-forge as the only channel
      ~/miniconda3/bin/conda config --add channels conda-forge
      ~/miniconda3/bin/conda config --set channel_priority strict
      # Show final config
      ~/miniconda3/bin/conda config --show channels
  args:
    executable: /bin/bash

# Use --override-channels to force conda-forge only
- name: SHELL ; update conda & miniconda from conda-forge only
  shell:
    cmd: ~/miniconda3/bin/conda update --all --yes --override-channels --channel conda-forge
  args:
    executable: /bin/bash

- name: SHELL ; conda install nb_conda_kernels from conda-forge only
  shell:
    cmd: ~/miniconda3/bin/conda install -n base notebook nb_conda_kernels --yes --override-channels --channel conda-forge
  args:
    executable: /bin/bash

- name: SHELL ; run conda create --name meta python=3.11 PyYaml ipykernel from conda-forge only
  shell:
    cmd: ~/miniconda3/bin/conda create --name meta python=3.11 PyYaml ipykernel --yes --override-channels --channel conda-forge
  args:
    creates: ~/miniconda3/envs/meta

# Configure conda to use the user's envs and pkgs directory (so that others the user adds later will
# be searched secondarily). This is setup is required for Geograypher.

- name: SHELL ; run conda config --append envs_dirs ~/miniconda3/envs
  shell:
    cmd: ~/miniconda3/bin/conda config --append envs_dirs ~/miniconda3/envs
    
- name: SHELL ; run conda config --append pkgs_dirs ~/miniconda3/pkgs
  shell:
    cmd: ~/miniconda3/bin/conda config --append pkgs_dirs ~/miniconda3/pkgs
    